<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MantleAudit — AI Smart Contract Auditor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
  .header { background: #111; border-bottom: 1px solid #222; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  .logo { font-size: 20px; font-weight: 700; color: #fff; }
  .badge { background: #1a3a2a; color: #4ade80; font-size: 11px; padding: 3px 10px; border-radius: 20px; border: 1px solid #2a5a3a; }
  .container { max-width: 900px; margin: 0 auto; padding: 40px 24px; }
  .hero { text-align: center; margin-bottom: 40px; }
  .hero h1 { font-size: 36px; font-weight: 700; color: #fff; margin-bottom: 12px; }
  .hero p { font-size: 16px; color: #888; max-width: 560px; margin: 0 auto; }
  .card { background: #111; border: 1px solid #222; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .card h2 { font-size: 14px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
  .input-row { display: flex; gap: 12px; margin-bottom: 16px; }
  .input-row input { flex: 1; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 14px; }
  .input-row input:focus { outline: none; border-color: #4ade80; }
  textarea { width: 100%; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; padding: 14px; color: #fff; font-size: 13px; font-family: 'SF Mono', Monaco, monospace; resize: vertical; min-height: 200px; }
  textarea:focus { outline: none; border-color: #4ade80; }
  .btn { background: #4ade80; color: #000; font-weight: 700; font-size: 15px; padding: 12px 32px; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 16px; transition: background 0.15s; }
  .btn:hover { background: #22c55e; }
  .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat { background: #111; border: 1px solid #222; border-radius: 10px; padding: 16px; text-align: center; }
  .stat-value { font-size: 28px; font-weight: 700; color: #fff; }
  .stat-label { font-size: 12px; color: #666; margin-top: 4px; }
  .risk-high { color: #ef4444; }
  .risk-med { color: #f59e0b; }
  .risk-low { color: #4ade80; }
  .findings { display: flex; flex-direction: column; gap: 10px; }
  .finding { background: #0a0a0a; border: 1px solid #222; border-radius: 8px; padding: 14px; border-left: 3px solid #333; }
  .finding.critical { border-left-color: #ef4444; }
  .finding.high { border-left-color: #f97316; }
  .finding.medium { border-left-color: #f59e0b; }
  .finding.low { border-left-color: #3b82f6; }
  .finding.info { border-left-color: #6b7280; }
  .finding-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .sev-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
  .sev-badge.critical { background: #450a0a; color: #ef4444; }
  .sev-badge.high { background: #431407; color: #f97316; }
  .sev-badge.medium { background: #451a03; color: #f59e0b; }
  .sev-badge.low { background: #172554; color: #3b82f6; }
  .sev-badge.info { background: #1f2937; color: #9ca3af; }
  .finding-title { font-size: 14px; font-weight: 600; color: #fff; }
  .finding-desc { font-size: 13px; color: #888; line-height: 1.5; margin-bottom: 6px; }
  .finding-rec { font-size: 12px; color: #4ade80; line-height: 1.5; }
  .tx-link { display: inline-flex; align-items: center; gap: 6px; background: #1a3a2a; color: #4ade80; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 600; margin-top: 12px; }
  .tx-link:hover { background: #2a5a3a; }
  .loading { text-align: center; padding: 40px; color: #666; }
  .spinner { width: 32px; height: 32px; border: 3px solid #222; border-top-color: #4ade80; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { background: #450a0a; border: 1px solid #7f1d1d; border-radius: 8px; padding: 16px; color: #ef4444; margin-top: 16px; }
  .onchain-toggle { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: #888; }
  .onchain-toggle input { accent-color: #4ade80; }
  .footer { text-align: center; padding: 24px; color: #444; font-size: 12px; }
  .footer a { color: #666; }
</style>
</head>
<body>

<div class="header">
  <span class="logo">⬡ MantleAudit</span>
  <span class="badge">Live on Mantle Mainnet</span>
</div>

<div class="container">
  <div class="hero">
    <h1>AI Smart Contract Auditor</h1>
    <p>Paste any Solidity contract and get an instant AI security audit. Every result posted permanently on Mantle.</p>
  </div>

  <div class="card">
    <h2>Audit a Contract</h2>
    <div class="input-row">
      <input type="text" id="contractName" placeholder="Contract name (e.g. MyToken)" />
    </div>
    <textarea id="soliditySource" placeholder="Paste your Solidity contract here..."></textarea>
    <div class="onchain-toggle">
      <input type="checkbox" id="postOnChain" />
      <label for="postOnChain">Post result on-chain to Mantle mainnet</label>
    </div>
    <button class="btn" id="auditBtn" onclick="runAudit()">Run Audit</button>
  </div>

  <div id="results"></div>
</div>

<div class="footer">
  <a href="https://mantlescan.xyz/address/0x07206421FaFFe4ABfA3Ca1F12ea2eAaB487a2f10" target="_blank">AuditRegistry Contract</a> ·
  <a href="https://github.com/knisaci/mantle-audit-agent" target="_blank">GitHub</a> ·
  Built for Mantle Turing Test Hackathon 2026
</div>

<script>
const BACKEND = 'https://mantle-audit-backend.onrender.com';

async function runAudit() {
  const contractName = document.getElementById('contractName').value.trim();
  const soliditySource = document.getElementById('soliditySource').value.trim();
  const postOnChain = document.getElementById('postOnChain').checked;
  const btn = document.getElementById('auditBtn');
  const results = document.getElementById('results');

  if (!contractName) { alert('Please enter a contract name'); return; }
  if (!soliditySource) { alert('Please paste your Solidity contract'); return; }

  btn.disabled = true;
  btn.textContent = 'Analysing...';
  results.innerHTML = '<div class="loading"><div class="spinner"></div><p>AI is auditing your contract...<br><small>This takes 15-30 seconds</small></p></div>';

  try {
    const response = await fetch(`${BACKEND}/audit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ soliditySource, contractName, postOnChain })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Audit failed');

    renderReport(data.report);
  } catch (err) {
    results.innerHTML = `<div class="error">Error: ${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Run Audit';
  }
}

function riskColor(score) {
  if (score >= 70) return 'risk-high';
  if (score >= 40) return 'risk-med';
  return 'risk-low';
}

function renderReport(report) {
  const critical = report.findings.filter(f => f.severity === 'critical').length;
  const high = report.findings.filter(f => f.severity === 'high').length;
  const total = report.findings.length;

  let html = `
    <div class="stats">
      <div class="stat">
        <div class="stat-value ${riskColor(report.riskScore)}">${report.riskScore}/100</div>
        <div class="stat-label">Risk Score</div>
      </div>
      <div class="stat">
        <div class="stat-value">${total}</div>
        <div class="stat-label">Total Findings</div>
      </div>
      <div class="stat">
        <div class="stat-value risk-high">${critical}</div>
        <div class="stat-label">Critical Issues</div>
      </div>
    </div>

    <div class="card">
      <h2>Summary</h2>
      <p style="color:#aaa;font-size:14px;line-height:1.6">${report.summary}</p>
      ${report.onChainTxHash ? `<a class="tx-link" href="https://mantlescan.xyz/tx/${report.onChainTxHash}" target="_blank">⬡ View on Mantlescan</a>` : ''}
    </div>

    <div class="card">
      <h2>Findings (${total})</h2>
      <div class="findings">
        ${report.findings.map(f => `
          <div class="finding ${f.severity}">
            <div class="finding-header">
              <span class="sev-badge ${f.severity}">${f.severity}</span>
              <span class="finding-title">${f.title}</span>
            </div>
            <div class="finding-desc">${f.description}</div>
            <div class="finding-rec">→ ${f.recommendation}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  document.getElementById('results').innerHTML = html;
}
</script>
</body>
</html>
